<!DOCTYPE html>
<html>
<head>
    <title>AetherWatch - Cyberpunk</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Orbitron', monospace;
            background: #0a0015;
            color: #ff00ff;
            padding: 20px;
            min-height: 100vh;
            background-image: 
                repeating-linear-gradient(0deg, rgba(255,0,255,0.03) 0px, transparent 2px),
                repeating-linear-gradient(90deg, rgba(0,255,255,0.03) 0px, transparent 2px);
            background-size: 100px 100px;
            animation: scanlines 8s linear infinite;
        }
        
        @keyframes scanlines { 0%, 100% { background-position: 0 0; } 50% { background-position: 50px 50px; } }
        @keyframes neon-glow { 0%, 100% { text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 30px #ff00ff; } 50% { text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff, 0 0 60px #ff00ff; } }
        @keyframes glitch { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 0, 255, 0.1);
            border: 2px solid #ff00ff;
            box-shadow: 0 0 30px rgba(255,0,255,0.5), inset 0 0 30px rgba(255,0,255,0.2);
        }
        
        .header h1 {
            font-size: 3em;
            font-weight: 900;
            color: #ff00ff;
            animation: neon-glow 2s ease-in-out infinite;
            text-transform: uppercase;
            letter-spacing: 5px;
        }
        
        .header p {
            color: #00ffff;
            font-size: 0.9em;
            margin-top: 10px;
            text-shadow: 0 0 10px #00ffff;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff00ff;
            padding: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255,0,255,0.3);
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,0,255,0.1), transparent);
            animation: shine 3s linear infinite;
        }
        
        @keyframes shine { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .card-title {
            font-size: 0.8em;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        
        .card-value {
            font-size: 2.5em;
            font-weight: 900;
            color: #ff00ff;
            text-shadow: 0 0 20px #ff00ff;
        }
        
        .drone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .drone-card {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ffff;
            padding: 15px;
            position: relative;
            transition: all 0.3s;
        }
        
        .drone-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0,255,255,0.5);
            border-color: #ff00ff;
        }
        
        .drone-id {
            font-weight: 700;
            color: #ff00ff;
            margin-bottom: 10px;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px currentColor;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .status-indicator.idle { background: #666; }
        .status-indicator.active { background: #00ff00; box-shadow: 0 0 20px #00ff00; }
        .status-indicator.charging { background: #ffff00; box-shadow: 0 0 20px #ffff00; }
        .status-indicator.error { background: #ff0000; box-shadow: 0 0 20px #ff0000; }
        
        .drone-status {
            font-size: 0.75em;
            color: #00ffff;
            margin: 5px 0;
        }
        
        .drone-battery {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border: 1px solid #00ffff;
            margin: 10px 0;
            position: relative;
            overflow: hidden;
        }
        
        .drone-battery-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            transition: width 0.5s;
            box-shadow: 0 0 10px #00ffff;
        }
        
        .trace-panel {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ffff;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 30px rgba(0,255,255,0.3);
        }
        
        .trace-panel::-webkit-scrollbar { width: 8px; }
        .trace-panel::-webkit-scrollbar-track { background: rgba(255,0,255,0.1); }
        .trace-panel::-webkit-scrollbar-thumb { background: #ff00ff; box-shadow: 0 0 10px #ff00ff; }
        
        .trace-entry {
            font-size: 0.8em;
            color: #00ffff;
            margin: 5px 0;
            padding: 5px;
            border-left: 2px solid #ff00ff;
            padding-left: 10px;
            animation: glitch 0.3s;
        }
        
        .trace-entry .timestamp { color: #ff00ff; }
        .trace-entry .success { color: #00ff00; }
        .trace-entry .error { color: #ff0000; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ AETHERWATCH ⚡</h1>
        <p>CYBERPUNK DRONE CONTROL MATRIX</p>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <div class="card-title">Active Drones</div>
            <div class="card-value" id="active-drones">0</div>
        </div>
        <div class="card">
            <div class="card-title">Avg Battery</div>
            <div class="card-value" id="avg-battery">0%</div>
        </div>
        <div class="card">
            <div class="card-title">Completed</div>
            <div class="card-value" id="completed-missions">0</div>
        </div>
        <div class="card">
            <div class="card-title">Success Rate</div>
            <div class="card-value" id="success-rate">0%</div>
        </div>
        <div class="card">
            <div class="card-title">Warnings</div>
            <div class="card-value" id="collision-warnings">0</div>
        </div>
        <div class="card">
            <div class="card-title">Active Missions</div>
            <div class="card-value" id="active-missions">0</div>
        </div>
    </div>

    <h2 style="color: #00ffff; text-align: center; margin: 20px 0; text-shadow: 0 0 20px #00ffff;">DRONE FLEET</h2>
    <div class="drone-grid" id="drone-grid"></div>

    <h2 style="color: #ff00ff; text-align: center; margin: 20px 0; text-shadow: 0 0 20px #ff00ff;">SYSTEM LOG</h2>
    <div class="trace-panel" id="trace-stream"></div>

    <script src="/static/dashboard.js"></script>
</body>
</html>
