<!DOCTYPE html>
<html>
<head>
    <title>AetherWatch - Matrix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Courier Prime', monospace;
            background: #000;
            color: #0f0;
            padding: 20px;
            min-height: 100vh;
            background-image: 
                linear-gradient(rgba(0,255,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,0,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            animation: matrix-rain 20s linear infinite;
        }
        
        @keyframes matrix-rain {
            0% { background-position: 0 0; }
            100% { background-position: 0 400px; }
        }
        
        @keyframes matrix-flicker {
            0%, 100% { opacity: 0.95; }
            50% { opacity: 1; }
        }
        
        @keyframes matrix-glow {
            0%, 100% { text-shadow: 0 0 5px #0f0, 0 0 10px #0f0; }
            50% { text-shadow: 0 0 10px #0f0, 0 0 20px #0f0, 0 0 30px #0f0; }
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(0deg, rgba(0,255,0,0.05) 0px, transparent 2px);
            pointer-events: none;
            animation: matrix-flicker 0.1s infinite;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            border: 2px solid #0f0;
            box-shadow: 0 0 20px rgba(0,255,0,0.3), inset 0 0 20px rgba(0,255,0,0.1);
            animation: matrix-glow 3s ease-in-out infinite;
        }
        
        .header h1 {
            font-size: 3em;
            color: #0f0;
            text-transform: uppercase;
            letter-spacing: 10px;
            animation: matrix-glow 2s ease-in-out infinite;
        }
        
        .header p {
            color: #0a0;
            font-size: 0.9em;
            margin-top: 10px;
            text-shadow: 0 0 10px #0f0;
        }
        
        .header p::before { content: '> '; }
        .header p::after { content: ' <'; animation: blink 1s step-start infinite; }
        
        @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(0,20,0,0.8);
            border: 1px solid #0f0;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0,255,0,0.2);
            position: relative;
        }
        
        .card::before {
            content: '> ';
            position: absolute;
            top: 5px;
            left: 5px;
            color: #0f0;
            font-size: 0.8em;
        }
        
        .card-title {
            font-size: 0.75em;
            color: #0a0;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        
        .card-value {
            font-size: 2.5em;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
            font-family: monospace;
        }
        
        .drone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .drone-card {
            background: rgba(0,15,0,0.9);
            border: 1px solid #0a0;
            padding: 15px;
            transition: all 0.3s;
        }
        
        .drone-card:hover {
            border-color: #0f0;
            box-shadow: 0 0 20px rgba(0,255,0,0.4);
            transform: translateY(-2px);
        }
        
        .drone-id {
            font-weight: bold;
            color: #0f0;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 8px #0f0;
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            display: inline-block;
            animation: matrix-glow 2s infinite;
        }
        
        .status-indicator.idle { background: #030; border: 1px solid #0a0; }
        .status-indicator.active { background: #0f0; border: 1px solid #0f0; box-shadow: 0 0 10px #0f0; }
        .status-indicator.charging { background: #0a0; border: 1px solid #0f0; }
        .status-indicator.error { background: #f00; border: 1px solid #f00; box-shadow: 0 0 10px #f00; }
        
        .drone-status {
            font-size: 0.7em;
            color: #0a0;
            margin: 5px 0;
        }
        
        .drone-battery {
            width: 100%;
            height: 6px;
            background: rgba(0,50,0,0.5);
            border: 1px solid #0a0;
            margin: 10px 0;
        }
        
        .drone-battery-fill {
            height: 100%;
            background: #0f0;
            transition: width 0.5s;
            box-shadow: 0 0 10px #0f0;
        }
        
        .trace-panel {
            background: rgba(0,10,0,0.9);
            border: 2px solid #0f0;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            font-family: monospace;
            box-shadow: 0 0 20px rgba(0,255,0,0.2);
        }
        
        .trace-panel::-webkit-scrollbar { width: 8px; }
        .trace-panel::-webkit-scrollbar-track { background: rgba(0,20,0,0.5); }
        .trace-panel::-webkit-scrollbar-thumb { background: #0f0; box-shadow: 0 0 5px #0f0; }
        
        .trace-entry {
            font-size: 0.8em;
            color: #0f0;
            margin: 5px 0;
            padding: 5px;
            border-left: 2px solid #0a0;
            padding-left: 10px;
            text-shadow: 0 0 5px #0f0;
        }
        
        .trace-entry::before {
            content: '█ ';
            animation: blink 1s step-start infinite;
        }
        
        .trace-entry .timestamp { color: #0a0; }
        .trace-entry .success { color: #0f0; }
        .trace-entry .error { color: #f00; text-shadow: 0 0 10px #f00; }
        
        h2 {
            color: #0f0;
            text-align: center;
            margin: 25px 0;
            font-size: 1.5em;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 15px #0f0;
            border-top: 1px solid #0f0;
            border-bottom: 1px solid #0f0;
            padding: 15px;
        }
        
        h2::before { content: '[ '; }
        h2::after { content: ' ]'; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AETHERWATCH</h1>
        <p>THE MATRIX HAS YOU</p>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <div class="card-title">Active</div>
            <div class="card-value" id="active-drones">0</div>
        </div>
        <div class="card">
            <div class="card-title">Battery</div>
            <div class="card-value" id="avg-battery">0%</div>
        </div>
        <div class="card">
            <div class="card-title">Complete</div>
            <div class="card-value" id="completed-missions">0</div>
        </div>
        <div class="card">
            <div class="card-title">Success</div>
            <div class="card-value" id="success-rate">0%</div>
        </div>
        <div class="card">
            <div class="card-title">Warnings</div>
            <div class="card-value" id="collision-warnings">0</div>
        </div>
        <div class="card">
            <div class="card-title">Active</div>
            <div class="card-value" id="active-missions">0</div>
        </div>
    </div>

    <h2>DRONE MATRIX</h2>
    <div class="drone-grid" id="drone-grid"></div>

    <h2>SYSTEM TRACE</h2>
    <div class="trace-panel" id="trace-stream"></div>

    <script src="/static/dashboard.js"></script>
</body>
</html>
