<!DOCTYPE html>
<html>
<head>
    <title>AetherWatch - Tactical</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Share Tech Mono', monospace;
            background: #0a1008;
            color: #00ff00;
            padding: 20px;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(0,80,0,0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0,80,0,0.2) 0%, transparent 50%);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0,40,0,0.5);
            border: 3px solid #00ff00;
            border-style: double;
            position: relative;
        }
        
        .header::before, .header::after {
            content: '▓▓▓';
            position: absolute;
            top: 10px;
            color: #00ff00;
            font-size: 2em;
        }
        
        .header::before { left: 10px; }
        .header::after { right: 10px; }
        
        .header h1 {
            font-size: 2.5em;
            color: #00ff00;
            text-transform: uppercase;
            letter-spacing: 8px;
            font-weight: normal;
        }
        
        .header p {
            color: #00aa00;
            font-size: 0.9em;
            margin-top: 10px;
            text-transform: uppercase;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(0, 30, 0, 0.6);
            border: 2px solid #00ff00;
            padding: 20px;
            position: relative;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        
        .card::before {
            content: '■';
            position: absolute;
            top: 5px;
            right: 5px;
            color: #00ff00;
            animation: blink 1s infinite;
        }
        
        @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
        
        .card-title {
            font-size: 0.75em;
            color: #00aa00;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        
        .card-value {
            font-size: 2.2em;
            font-weight: bold;
            color: #00ff00;
            font-family: monospace;
        }
        
        .drone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .drone-card {
            background: rgba(0, 40, 0, 0.4);
            border: 2px solid #00aa00;
            padding: 12px;
            position: relative;
            transition: all 0.3s;
        }
        
        .drone-card:hover {
            background: rgba(0, 60, 0, 0.6);
            border-color: #00ff00;
            box-shadow: 0 0 20px rgba(0,255,0,0.3);
        }
        
        .drone-id {
            font-weight: bold;
            color: #00ff00;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 0;
            display: inline-block;
            border: 1px solid currentColor;
        }
        
        .status-indicator.idle { background: #003300; }
        .status-indicator.active { background: #00ff00; animation: radar-pulse 2s infinite; }
        .status-indicator.charging { background: #ffff00; }
        .status-indicator.error { background: #ff0000; }
        
        @keyframes radar-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0,255,0,0.7); }
            50% { box-shadow: 0 0 0 10px rgba(0,255,0,0); }
        }
        
        .drone-status {
            font-size: 0.7em;
            color: #00aa00;
            margin: 4px 0;
        }
        
        .drone-battery {
            width: 100%;
            height: 8px;
            background: rgba(0,100,0,0.3);
            border: 1px solid #00ff00;
            margin: 8px 0;
            position: relative;
        }
        
        .drone-battery-fill {
            height: 100%;
            background: repeating-linear-gradient(90deg, #00ff00 0px, #00ff00 4px, #00aa00 4px, #00aa00 8px);
            transition: width 0.5s;
        }
        
        .trace-panel {
            background: rgba(0, 20, 0, 0.8);
            border: 2px solid #00ff00;
            padding: 15px;
            height: 350px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85em;
        }
        
        .trace-panel::-webkit-scrollbar { width: 6px; }
        .trace-panel::-webkit-scrollbar-track { background: rgba(0,50,0,0.3); }
        .trace-panel::-webkit-scrollbar-thumb { background: #00ff00; }
        
        .trace-entry {
            color: #00ff00;
            margin: 3px 0;
            padding: 4px;
            border-left: 3px solid #00aa00;
            padding-left: 8px;
        }
        
        .trace-entry .timestamp { color: #00aa00; }
        .trace-entry .success { color: #00ff00; text-shadow: 0 0 5px #00ff00; }
        .trace-entry .error { color: #ff0000; }
        
        h2 {
            color: #00ff00;
            text-align: center;
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            border-top: 2px solid #00ff00;
            border-bottom: 2px solid #00ff00;
            padding: 10px;
            background: rgba(0, 40, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⬢ AETHERWATCH ⬢</h1>
        <p>TACTICAL COMMAND INTERFACE</p>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <div class="card-title">Active Units</div>
            <div class="card-value" id="active-drones">0</div>
        </div>
        <div class="card">
            <div class="card-title">Power Status</div>
            <div class="card-value" id="avg-battery">0%</div>
        </div>
        <div class="card">
            <div class="card-title">Ops Complete</div>
            <div class="card-value" id="completed-missions">0</div>
        </div>
        <div class="card">
            <div class="card-title">Mission Rate</div>
            <div class="card-value" id="success-rate">0%</div>
        </div>
        <div class="card">
            <div class="card-title">Threats</div>
            <div class="card-value" id="collision-warnings">0</div>
        </div>
        <div class="card">
            <div class="card-title">Active Ops</div>
            <div class="card-value" id="active-missions">0</div>
        </div>
    </div>

    <h2>▓ UNIT STATUS ▓</h2>
    <div class="drone-grid" id="drone-grid"></div>

    <h2>▓ OPERATION LOG ▓</h2>
    <div class="trace-panel" id="trace-stream"></div>

    <script src="/static/dashboard.js"></script>
</body>
</html>
