<!DOCTYPE html>
<html>
<head>
    <title>AetherWatch - Minimalist Swiss</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@300;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Helvetica Neue', 'Arial', sans-serif;
            background: #fff;
            color: #000;
            padding: 40px;
            min-height: 100vh;
        }
        
        .header {
            text-align: left;
            margin-bottom: 60px;
            border-bottom: 4px solid #000;
            padding-bottom: 20px;
        }
        
        .header h1 {
            font-size: 3.5em;
            font-weight: 700;
            color: #000;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 0.9;
        }
        
        .header p {
            color: #ff0000;
            font-size: 0.9em;
            margin-top: 10px;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            margin-bottom: 60px;
            background: #000;
        }
        
        .card {
            background: #fff;
            padding: 30px;
            transition: all 0.3s;
        }
        
        .card:hover {
            background: #ff0000;
        }
        
        .card:hover .card-title,
        .card:hover .card-value {
            color: #fff;
        }
        
        .card-title {
            font-size: 0.8em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 300;
        }
        
        .card-value {
            font-size: 3em;
            font-weight: 700;
            color: #000;
        }
        
        .drone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 2px;
            margin-bottom: 60px;
            background: #000;
        }
        
        .drone-card {
            background: #fff;
            padding: 20px;
            transition: all 0.3s;
            border: none;
        }
        
        .drone-card:hover {
            background: #000;
            color: #fff;
        }
        
        .drone-id {
            font-weight: 700;
            font-size: 1.2em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            display: inline-block;
        }
        
        .status-indicator.idle { background: #ccc; }
        .status-indicator.active { background: #000; }
        .status-indicator.charging { background: #ff0000; }
        .status-indicator.error { background: #ff0000; }
        
        .drone-status {
            font-size: 0.75em;
            color: #666;
            margin: 6px 0;
            font-weight: 300;
        }
        
        .drone-card:hover .drone-status {
            color: #fff;
        }
        
        .drone-battery {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            margin: 12px 0;
        }
        
        .drone-battery-fill {
            height: 100%;
            background: #000;
            transition: width 0.5s;
        }
        
        .drone-card:hover .drone-battery {
            background: #333;
        }
        
        .drone-card:hover .drone-battery-fill {
            background: #fff;
        }
        
        .trace-panel {
            background: #f5f5f5;
            padding: 30px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            border-left: 4px solid #000;
        }
        
        .trace-panel::-webkit-scrollbar { width: 4px; }
        .trace-panel::-webkit-scrollbar-track { background: #e0e0e0; }
        .trace-panel::-webkit-scrollbar-thumb { background: #000; }
        
        .trace-entry {
            font-size: 0.75em;
            color: #000;
            margin: 8px 0;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
            font-weight: 300;
        }
        
        .trace-entry .timestamp { color: #666; }
        .trace-entry .success { color: #000; font-weight: 700; }
        .trace-entry .error { color: #ff0000; font-weight: 700; }
        
        h2 {
            font-size: 1.5em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 40px 0 20px 0;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>AETHER<br>WATCH</h1>
        <p>SWISS DESIGN INTERFACE</p>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <div class="card-title">Active</div>
            <div class="card-value" id="active-drones">0</div>
        </div>
        <div class="card">
            <div class="card-title">Battery</div>
            <div class="card-value" id="avg-battery">0%</div>
        </div>
        <div class="card">
            <div class="card-title">Complete</div>
            <div class="card-value" id="completed-missions">0</div>
        </div>
        <div class="card">
            <div class="card-title">Success</div>
            <div class="card-value" id="success-rate">0%</div>
        </div>
        <div class="card">
            <div class="card-title">Warnings</div>
            <div class="card-value" id="collision-warnings">0</div>
        </div>
        <div class="card">
            <div class="card-title">Active</div>
            <div class="card-value" id="active-missions">0</div>
        </div>
    </div>

    <h2>Drone Fleet</h2>
    <div class="drone-grid" id="drone-grid"></div>

    <h2>System Log</h2>
    <div class="trace-panel" id="trace-stream"></div>

    <script src="/static/dashboard.js"></script>
</body>
</html>
