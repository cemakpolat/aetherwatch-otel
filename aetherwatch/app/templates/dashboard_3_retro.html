<!DOCTYPE html>
<html>
<head>
    <title>AetherWatch - Retro Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'VT323', monospace;
            background: #000;
            color: #ffb000;
            padding: 20px;
            min-height: 100vh;
            background-image: 
                repeating-linear-gradient(0deg, rgba(255,176,0,0.03) 0px, transparent 4px);
            animation: screen-flicker 0.15s infinite;
        }
        
        @keyframes screen-flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.97; }
        }
        
        @keyframes crt-scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255,176,0,0.1);
            z-index: 1000;
            pointer-events: none;
            animation: crt-scan 8s linear infinite;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            border: 4px double #ffb000;
            text-shadow: 0 0 10px #ffb000;
        }
        
        .header h1 {
            font-size: 4em;
            color: #ffb000;
            text-transform: uppercase;
            letter-spacing: 10px;
        }
        
        .header p {
            color: #ff8800;
            font-size: 1.5em;
            margin-top: 10px;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255,176,0,0.05);
            border: 3px solid #ffb000;
            padding: 20px;
            text-shadow: 0 0 8px #ffb000;
        }
        
        .card::before {
            content: '[ ';
            color: #ffb000;
        }
        
        .card::after {
            content: ' ]';
            color: #ffb000;
        }
        
        .card-title {
            font-size: 1.2em;
            color: #ffb000;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .card-value {
            font-size: 3.5em;
            color: #ffb000;
            font-weight: normal;
        }
        
        .drone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .drone-card {
            background: rgba(255,176,0,0.05);
            border: 2px solid #ffb000;
            padding: 15px;
            transition: all 0.3s;
        }
        
        .drone-card:hover {
            background: rgba(255,176,0,0.1);
            box-shadow: 0 0 20px rgba(255,176,0,0.3);
        }
        
        .drone-id {
            font-size: 1.5em;
            color: #ffb000;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            display: inline-block;
            border: 2px solid currentColor;
            animation: terminal-blink 1s steps(1) infinite;
        }
        
        @keyframes terminal-blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0.3; }
        }
        
        .status-indicator.idle { background: #664400; border-color: #ffb000; }
        .status-indicator.active { background: #ffb000; border-color: #ffb000; }
        .status-indicator.charging { background: #ff8800; border-color: #ff8800; }
        .status-indicator.error { background: #ff0000; border-color: #ff0000; }
        
        .drone-status {
            font-size: 1.2em;
            color: #ff8800;
            margin: 5px 0;
        }
        
        .drone-battery {
            width: 100%;
            height: 10px;
            background: rgba(255,176,0,0.2);
            border: 2px solid #ffb000;
            margin: 10px 0;
        }
        
        .drone-battery-fill {
            height: 100%;
            background: #ffb000;
            transition: width 0.5s;
            box-shadow: 0 0 10px #ffb000;
        }
        
        .trace-panel {
            background: rgba(255,176,0,0.05);
            border: 3px double #ffb000;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            font-size: 1.2em;
        }
        
        .trace-panel::-webkit-scrollbar { width: 10px; }
        .trace-panel::-webkit-scrollbar-track { background: rgba(255,176,0,0.1); }
        .trace-panel::-webkit-scrollbar-thumb { background: #ffb000; }
        
        .trace-entry {
            color: #ffb000;
            margin: 6px 0;
            padding: 5px;
            border-left: 4px solid #ff8800;
            padding-left: 12px;
        }
        
        .trace-entry::before {
            content: '> ';
        }
        
        .trace-entry .timestamp { color: #ff8800; }
        .trace-entry .success { color: #ffb000; }
        .trace-entry .error { color: #ff0000; animation: terminal-blink 0.5s infinite; }
        
        h2 {
            color: #ffb000;
            text-align: center;
            margin: 20px 0;
            font-size: 2em;
            text-transform: uppercase;
            letter-spacing: 8px;
            border: 3px double #ffb000;
            padding: 15px;
            text-shadow: 0 0 10px #ffb000;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>AETHERWATCH</h1>
        <p>TERMINAL v1.0 -- READY --</p>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <div class="card-title">Active</div>
            <div class="card-value" id="active-drones">0</div>
        </div>
        <div class="card">
            <div class="card-title">Battery</div>
            <div class="card-value" id="avg-battery">0%</div>
        </div>
        <div class="card">
            <div class="card-title">Complete</div>
            <div class="card-value" id="completed-missions">0</div>
        </div>
        <div class="card">
            <div class="card-title">Success</div>
            <div class="card-value" id="success-rate">0%</div>
        </div>
        <div class="card">
            <div class="card-title">Warnings</div>
            <div class="card-value" id="collision-warnings">0</div>
        </div>
        <div class="card">
            <div class="card-title">Active</div>
            <div class="card-value" id="active-missions">0</div>
        </div>
    </div>

    <h2>== DRONE STATUS ==</h2>
    <div class="drone-grid" id="drone-grid"></div>

    <h2>== SYSTEM MESSAGES ==</h2>
    <div class="trace-panel" id="trace-stream"></div>

    <script src="/static/dashboard.js"></script>
</body>
</html>
