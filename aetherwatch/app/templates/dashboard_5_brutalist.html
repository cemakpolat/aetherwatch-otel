<!DOCTYPE html>
<html>
<head>
    <title>AetherWatch - Brutalist</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Space Grotesk', monospace;
            background: #1a1a1a;
            color: #f0f0f0;
            padding: 0;
            min-height: 100vh;
        }
        
        .header {
            background: #2a2a2a;
            padding: 60px 40px;
            border-bottom: 20px solid #000;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.5);
        }
        
        .header h1 {
            font-size: 5em;
            font-weight: 700;
            color: #f0f0f0;
            text-transform: uppercase;
            letter-spacing: -4px;
            line-height: 0.8;
            text-shadow: 8px 8px 0 #000;
        }
        
        .header p {
            color: #999;
            font-size: 1.2em;
            margin-top: 20px;
            font-weight: 700;
            text-transform: uppercase;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 0;
        }
        
        .card {
            background: #2a2a2a;
            border: 5px solid #000;
            padding: 40px;
            position: relative;
            transition: all 0.3s;
        }
        
        .card:hover {
            background: #000;
            transform: scale(1.02);
            z-index: 10;
        }
        
        .card-title {
            font-size: 0.9em;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .card-value {
            font-size: 4em;
            font-weight: 700;
            color: #f0f0f0;
            line-height: 1;
        }
        
        .drone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0;
            margin-top: 40px;
        }
        
        .drone-card {
            background: #2a2a2a;
            border: 5px solid #000;
            padding: 25px;
            transition: all 0.2s;
        }
        
        .drone-card:hover {
            background: #000;
        }
        
        .drone-id {
            font-weight: 700;
            font-size: 1.4em;
            margin-bottom: 15px;
            color: #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
        }
        
        .status-indicator {
            width: 15px;
            height: 15px;
            display: inline-block;
            border: 3px solid #000;
        }
        
        .status-indicator.idle { background: #555; }
        .status-indicator.active { background: #f0f0f0; }
        .status-indicator.charging { background: #999; }
        .status-indicator.error { background: #ff0000; }
        
        .drone-status {
            font-size: 0.8em;
            color: #999;
            margin: 8px 0;
            text-transform: uppercase;
            font-weight: 700;
        }
        
        .drone-battery {
            width: 100%;
            height: 15px;
            background: #000;
            border: 3px solid #000;
            margin: 15px 0;
        }
        
        .drone-battery-fill {
            height: 100%;
            background: #f0f0f0;
            transition: width 0.5s;
        }
        
        .trace-panel {
            background: #000;
            border: 10px solid #2a2a2a;
            padding: 30px;
            height: 500px;
            overflow-y: auto;
            font-family: monospace;
            margin: 40px;
        }
        
        .trace-panel::-webkit-scrollbar { width: 15px; }
        .trace-panel::-webkit-scrollbar-track { background: #1a1a1a; }
        .trace-panel::-webkit-scrollbar-thumb { background: #2a2a2a; border: 3px solid #000; }
        
        .trace-entry {
            font-size: 0.9em;
            color: #999;
            margin: 10px 0;
            padding: 10px;
            border-left: 5px solid #2a2a2a;
            font-weight: 700;
        }
        
        .trace-entry .timestamp { color: #777; }
        .trace-entry .success { color: #f0f0f0; }
        .trace-entry .error { color: #ff0000; }
        
        h2 {
            font-size: 3em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -2px;
            margin: 40px;
            color: #f0f0f0;
            text-shadow: 4px 4px 0 #000;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>AETHER<br>WATCH</h1>
        <p>BRUTALIST INTERFACE</p>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <div class="card-title">Active</div>
            <div class="card-value" id="active-drones">0</div>
        </div>
        <div class="card">
            <div class="card-title">Battery</div>
            <div class="card-value" id="avg-battery">0%</div>
        </div>
        <div class="card">
            <div class="card-title">Complete</div>
            <div class="card-value" id="completed-missions">0</div>
        </div>
        <div class="card">
            <div class="card-title">Success</div>
            <div class="card-value" id="success-rate">0%</div>
        </div>
        <div class="card">
            <div class="card-title">Warnings</div>
            <div class="card-value" id="collision-warnings">0</div>
        </div>
        <div class="card">
            <div class="card-title">Active</div>
            <div class="card-value" id="active-missions">0</div>
        </div>
    </div>

    <h2>FLEET</h2>
    <div class="drone-grid" id="drone-grid"></div>

    <h2>LOG</h2>
    <div class="trace-panel" id="trace-stream"></div>

    <script src="/static/dashboard.js"></script>
</body>
</html>
