<!DOCTYPE html>
<html>
<head>
    <title>AetherWatch - Holographic</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@300;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Exo 2', sans-serif;
            background: #000;
            color: #fff;
            padding: 30px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        @keyframes holo-shift {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(60deg); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 50%, rgba(0,255,255,0.2) 0%, transparent 30%),
                radial-gradient(circle at 70% 50%, rgba(255,0,255,0.2) 0%, transparent 30%);
            animation: holo-shift 6s ease-in-out infinite;
            pointer-events: none;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: linear-gradient(135deg, rgba(0,255,255,0.1), rgba(255,0,255,0.1));
            border: 2px solid transparent;
            border-image: linear-gradient(45deg, #00ffff, #ff00ff, #00ffff) 1;
            position: relative;
            z-index: 2;
            animation: float 4s ease-in-out infinite;
        }
        
        .header h1 {
            font-size: 3.5em;
            font-weight: 700;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 8px;
            animation: holo-shift 3s ease-in-out infinite;
        }
        
        .header p {
            color: #00ffff;
            font-size: 1em;
            margin-top: 15px;
            font-weight: 300;
            text-shadow: 0 0 20px rgba(0,255,255,0.8);
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            z-index: 2;
            position: relative;
        }
        
        .card {
            background: linear-gradient(135deg, rgba(0,255,255,0.05), rgba(255,0,255,0.05));
            border: 2px solid transparent;
            border-image: linear-gradient(135deg, #00ffff, #ff00ff) 1;
            padding: 25px;
            position: relative;
            transition: all 0.3s;
            animation: float 4s ease-in-out infinite;
        }
        
        .card:nth-child(even) {
            animation-delay: 0.5s;
        }
        
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .card:hover::before {
            opacity: 0.1;
        }
        
        .card:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0,255,255,0.3);
        }
        
        .card-title {
            font-size: 0.8em;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
            font-weight: 300;
        }
        
        .card-value {
            font-size: 2.8em;
            font-weight: 700;
            background: linear-gradient(90deg, #00ffff, #ffffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0,255,255,0.5);
        }
        
        .drone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
            z-index: 2;
            position: relative;
        }
        
        .drone-card {
            background: linear-gradient(135deg, rgba(0,255,255,0.05), rgba(255,0,255,0.05));
            border: 1px solid transparent;
            border-image: linear-gradient(90deg, #00ffff, #ff00ff) 1;
            padding: 18px;
            transition: all 0.3s;
            position: relative;
        }
        
        .drone-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,255,255,0.4);
        }
        
        .drone-id {
            font-weight: 700;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 5px currentColor; }
            50% { box-shadow: 0 0 20px currentColor; }
        }
        
        .status-indicator.idle { background: rgba(255,255,255,0.3); }
        .status-indicator.active { background: #00ffff; box-shadow: 0 0 20px #00ffff; }
        .status-indicator.charging { background: #ff00ff; box-shadow: 0 0 20px #ff00ff; }
        .status-indicator.error { background: #ff0000; box-shadow: 0 0 20px #ff0000; }
        
        .drone-status {
            font-size: 0.75em;
            color: rgba(255,255,255,0.7);
            margin: 6px 0;
            font-weight: 300;
        }
        
        .drone-battery {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            margin: 10px 0;
            position: relative;
            overflow: hidden;
        }
        
        .drone-battery-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            transition: width 0.5s;
            box-shadow: 0 0 10px #00ffff;
        }
        
        .trace-panel {
            background: linear-gradient(135deg, rgba(0,255,255,0.03), rgba(255,0,255,0.03));
            border: 2px solid transparent;
            border-image: linear-gradient(135deg, #00ffff, #ff00ff) 1;
            padding: 25px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            z-index: 2;
            position: relative;
        }
        
        .trace-panel::-webkit-scrollbar { width: 6px; }
        .trace-panel::-webkit-scrollbar-track { background: rgba(0,255,255,0.1); }
        .trace-panel::-webkit-scrollbar-thumb { 
            background: linear-gradient(180deg, #00ffff, #ff00ff);
            box-shadow: 0 0 10px #00ffff;
        }
        
        .trace-entry {
            font-size: 0.8em;
            color: rgba(255,255,255,0.8);
            margin: 8px 0;
            padding: 8px;
            border-left: 2px solid transparent;
            border-image: linear-gradient(180deg, #00ffff, #ff00ff) 1;
        }
        
        .trace-entry .timestamp { 
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .trace-entry .success { color: #00ffff; text-shadow: 0 0 10px #00ffff; }
        .trace-entry .error { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
        
        h2 {
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin: 30px 0 20px 0;
            font-size: 2em;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            z-index: 2;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>◇ AETHERWATCH ◇</h1>
        <p>HOLOGRAPHIC INTERFACE SYSTEM</p>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <div class="card-title">Active</div>
            <div class="card-value" id="active-drones">0</div>
        </div>
        <div class="card">
            <div class="card-title">Battery</div>
            <div class="card-value" id="avg-battery">0%</div>
        </div>
        <div class="card">
            <div class="card-title">Complete</div>
            <div class="card-value" id="completed-missions">0</div>
        </div>
        <div class="card">
            <div class="card-title">Success</div>
            <div class="card-value" id="success-rate">0%</div>
        </div>
        <div class="card">
            <div class="card-title">Warnings</div>
            <div class="card-value" id="collision-warnings">0</div>
        </div>
        <div class="card">
            <div class="card-title">Active</div>
            <div class="card-value" id="active-missions">0</div>
        </div>
    </div>

    <h2>◆ DRONE FLEET ◆</h2>
    <div class="drone-grid" id="drone-grid"></div>

    <h2>◆ SYSTEM LOG ◆</h2>
    <div class="trace-panel" id="trace-stream"></div>

    <script src="/static/dashboard.js"></script>
</body>
</html>
