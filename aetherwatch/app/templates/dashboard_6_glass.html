<!DOCTYPE html>
<html>
<head>
    <title>AetherWatch - Glassmorphism</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            color: #fff;
            padding: 30px;
            min-height: 100vh;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="rgba(255,255,255,0.05)"/></svg>');
            background-size: 100px 100px;
            pointer-events: none;
            z-index: 1;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 2;
        }
        
        .header h1 {
            font-size: 3em;
            font-weight: 600;
            color: #fff;
            letter-spacing: 3px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1em;
            margin-top: 10px;
            font-weight: 300;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            z-index: 2;
            position: relative;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.2);
        }
        
        .card-title {
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-weight: 300;
        }
        
        .card-value {
            font-size: 2.5em;
            font-weight: 600;
            color: #fff;
        }
        
        .drone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
            z-index: 2;
            position: relative;
        }
        
        .drone-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }
        
        .drone-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.03);
        }
        
        .drone-id {
            font-weight: 600;
            color: #fff;
            margin-bottom: 10px;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px currentColor;
        }
        
        .status-indicator.idle { background: rgba(255,255,255,0.3); }
        .status-indicator.active { background: #00ff88; box-shadow: 0 0 15px #00ff88; }
        .status-indicator.charging { background: #ffdd00; box-shadow: 0 0 15px #ffdd00; }
        .status-indicator.error { background: #ff4444; box-shadow: 0 0 15px #ff4444; }
        
        .drone-status {
            font-size: 0.75em;
            color: rgba(255, 255, 255, 0.8);
            margin: 5px 0;
            font-weight: 300;
        }
        
        .drone-battery {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            margin: 10px 0;
            overflow: hidden;
        }
        
        .drone-battery-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            transition: width 0.5s;
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.5);
        }
        
        .trace-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            z-index: 2;
            position: relative;
        }
        
        .trace-panel::-webkit-scrollbar { width: 6px; }
        .trace-panel::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
        .trace-panel::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 3px; }
        
        .trace-entry {
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.9);
            margin: 8px 0;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            border-left: 3px solid rgba(255, 255, 255, 0.3);
        }
        
        .trace-entry .timestamp { color: rgba(255, 255, 255, 0.6); }
        .trace-entry .success { color: #00ff88; }
        .trace-entry .error { color: #ff4444; }
        
        h2 {
            color: #fff;
            text-align: center;
            margin: 30px 0 20px 0;
            font-size: 1.8em;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 2;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✦ AetherWatch ✦</h1>
        <p>Glassmorphic Interface</p>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <div class="card-title">Active</div>
            <div class="card-value" id="active-drones">0</div>
        </div>
        <div class="card">
            <div class="card-title">Battery</div>
            <div class="card-value" id="avg-battery">0%</div>
        </div>
        <div class="card">
            <div class="card-title">Complete</div>
            <div class="card-value" id="completed-missions">0</div>
        </div>
        <div class="card">
            <div class="card-title">Success</div>
            <div class="card-value" id="success-rate">0%</div>
        </div>
        <div class="card">
            <div class="card-title">Warnings</div>
            <div class="card-value" id="collision-warnings">0</div>
        </div>
        <div class="card">
            <div class="card-title">Active</div>
            <div class="card-value" id="active-missions">0</div>
        </div>
    </div>

    <h2>Drone Fleet</h2>
    <div class="drone-grid" id="drone-grid"></div>

    <h2>System Log</h2>
    <div class="trace-panel" id="trace-stream"></div>

    <script src="/static/dashboard.js"></script>
</body>
</html>
