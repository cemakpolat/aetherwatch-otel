global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: aetherwatch
    environment: production

scrape_configs:
  - job_name: 'opentelemetry-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'aetherwatch-app'
    static_configs:
      - targets: ['app:5000']
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 3s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # - "alerts.yml"
